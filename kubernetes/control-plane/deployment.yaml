apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-control-plane
  namespace: idp-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: idp-control-plane
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idp-control-plane
    spec:
      serviceAccountName: idp-control-plane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/example-org/idp-control-plane:v1.0.0
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
