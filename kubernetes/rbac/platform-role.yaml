apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idp-deployer
  namespace: idp-dev
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
