global:
  resolve_timeout: 5m

route:
  receiver: "application-webhook"
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  - name: "application-webhook"
    webhook_configs:
      - url: "http://app:8000/alerts"
        send_resolved: true
